<!DOCTYPE html>
<html>
<head>
  <base href="/web/flutter_web/">
  <meta charset="UTF-8"> 
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Snapmaker Orca">
  <meta http-equiv="Permissions-Policy" content="local-files-write=*">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <meta http-equiv="Access-Control-Allow-Methods" content="GET, POST, PUT, DELETE, OPTIONS">
  <meta http-equiv="Access-Control-Allow-Headers" content="Content-Type, Authorization, x-amz-checksum-sha256">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#141416">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Snapmaker Orca</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Comprobar parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const pathParam = urlParams.get('path');

    // Si es la pestaña Inicio (Home), redirigir directamente a MakerWorld
    if (pathParam === '0' || pathParam === 'home' || pathParam === '1') {
      window.location.replace("https://makerworld.com/es");
    }
  </script>

  <style>
    html, body {
      overflow: hidden;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #121215;
    }

    /* Pastilla flotante minimalista para alternar entre Snapmaker AMS y Fluidd */
    #device-switcher-bar {
      display: none;
      position: fixed;
      top: 10px;
      right: 18px;
      z-index: 999999;
      background: rgba(22, 23, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 106, 0, 0.35);
      border-radius: 20px;
      padding: 3px 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 106, 0, 0.2);
      gap: 4px;
      align-items: center;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .switcher-btn {
      background: transparent;
      border: none;
      color: #a0a0aa;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease-in-out;
    }

    .switcher-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .switcher-btn.active {
      background: linear-gradient(135deg, #ff6a00 0%, #e65c00 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(255, 106, 0, 0.4);
    }

    /* Overlay de Fluidd a pantalla completa */
    #fluidd-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99998;
      background: #121215;
    }

    #fluidd-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Pastilla flotante para alternar vistas (sólo visible en pestaña Dispositivo) -->
  <div id="device-switcher-bar">
    <button id="btn-snapmaker" class="switcher-btn active" onclick="toggleDeviceView('snapmaker')">
      🎛️ Snapmaker U1 (AMS)
    </button>
    <button id="btn-fluidd" class="switcher-btn" onclick="toggleDeviceView('fluidd')">
      🌐 Fluidd Klipper
    </button>
  </div>

  <!-- Contenedor overlay para Fluidd Klipper -->
  <div id="fluidd-container">
    <iframe id="fluidd-iframe" src="about:blank"></iframe>
  </div>

  <!-- Carga nativa del motor Flutter Web oficial de Snapmaker -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    if ('application/octet-stream' in MimeType) {
      MimeType['image/webp'] = 'webp';
    }

    const isDevice = (pathParam === '2' || window.location.href.includes('path=2'));
    if (isDevice) {
      const bar = document.getElementById('device-switcher-bar');
      if (bar) bar.style.display = 'flex';
    }

    function toggleDeviceView(view) {
      const btnSnap = document.getElementById('btn-snapmaker');
      const btnFluidd = document.getElementById('btn-fluidd');
      const fluiddBox = document.getElementById('fluidd-container');
      const ifr = document.getElementById('fluidd-iframe');

      if (view === 'fluidd') {
        btnFluidd.classList.add('active');
        btnSnap.classList.remove('active');
        fluiddBox.style.display = 'block';
        if (ifr.src === 'about:blank' || !ifr.src.includes('192.168.1.30')) {
          ifr.src = "http://192.168.1.30/";
        }
      } else {
        btnSnap.classList.add('active');
        btnFluidd.classList.remove('active');
        fluiddBox.style.display = 'none';
      }
    }

    function open_orca_webview() {
      const message = JSON.stringify({
        seqid: 1222222,
        cmd: "sw_OpenOrcaWebview",
        params: {
          url: "http://127.0.0.1:7357/?locale=zh-cn-CN&dark_model=1&path=/",
        },
      });
      window.wx && window.wx.postMessage(message);
      if(!window.wx) {
        console.log('window.wx not found: ', message);
      }
    }

    window.sendMessage = function (message) {
      window.wx && window.wx.postMessage(message);
      if(!window.wx) {
        console.log('window.wx not found: ', message);
      }
    }
  </script>
</body>
</html>
