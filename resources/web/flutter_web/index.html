<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/web/flutter_web/">
  <meta charset="UTF-8"> 
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Snapmaker Orca Custom Orange">
  <meta http-equiv="Permissions-Policy" content="local-files-write=*">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <meta http-equiv="Access-Control-Allow-Methods" content="GET, POST, PUT, DELETE, OPTIONS">
  <meta http-equiv="Access-Control-Allow-Headers" content="Content-Type, Authorization, x-amz-checksum-sha256">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Snapmaker Orca (Orange Dark Edition)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f1013 !important;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #top-control-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: #14151a;
      border-bottom: 2px solid #ff6a00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100000;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 106, 0, 0.2);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #ff6a00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff6a00, 0 0 20px #ff6a00;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .printer-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .ip-badge {
      background: rgba(255, 106, 0, 0.15);
      border: 1px solid rgba(255, 106, 0, 0.4);
      color: #ff8c33;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
    }

    .nav-tab-btn {
      background: #1e2026;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #b8b8b8;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease-in-out;
    }

    .nav-tab-btn:hover {
      background: #2a2d36;
      color: #ffffff;
      border-color: #ff6a00;
    }

    .nav-tab-btn.active {
      background: linear-gradient(135deg, #ff6a00, #e65c00);
      color: #ffffff;
      border-color: #ffa34d;
      box-shadow: 0 0 14px rgba(255, 106, 0, 0.5);
    }

    .view-panel {
      position: absolute;
      top: 44px;
      left: 0;
      width: 100%;
      height: calc(100% - 44px);
      overflow: hidden;
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    #panel-fluidd iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #121214;
    }

    #panel-gui {
      background: radial-gradient(circle at center, #1b1c22 0%, #0d0e11 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #panel-gui.active {
      display: flex;
    }

    .touch-wrapper {
      padding: 16px;
      background: #14151a;
      border-radius: 16px;
      border: 2px solid rgba(255, 106, 0, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 106, 0, 0.2);
      text-align: center;
    }

    .touch-wrapper h3 {
      font-size: 13px;
      color: #ff8c33;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .touch-wrapper iframe {
      width: 480px;
      height: 320px;
      border: none;
      border-radius: 8px;
      background: #000;
      display: block;
    }

    #panel-snap {
      background: #121215;
    }
  </style>

  <script>
    const search = window.location.search || '';
    const isDeviceTab = search.includes('discovery') || search.includes('path=2') || search.includes('device') || search.includes('monitor');
    if (!isDeviceTab) {
      window.location.replace("https://makerworld.com/es");
    }
  </script>
</head>
<body>

  <div id="top-control-bar" style="display: none;">
    <div class="brand-section">
      <span class="pulse-dot"></span>
      <span class="printer-title">Snapmaker U1 Pax12</span>
      <span class="ip-badge">192.168.1.30</span>
    </div>
    <div class="nav-tabs">
      <button id="tab-btn-fluidd" class="nav-tab-btn active" onclick="showView('fluidd')">🌐 Fluidd Klipper (Cámaras + Consola)</button>
      <button id="tab-btn-gui" class="nav-tab-btn" onclick="showView('gui')">📱 Pantalla Táctil U1 (Touch)</button>
      <button id="tab-btn-snap" class="nav-tab-btn" onclick="showView('snap')">🎛️ Snapmaker Panel (AMS / Filamentos)</button>
    </div>
  </div>

  <div id="panel-fluidd" class="view-panel active">
    <iframe id="iframe-fluidd" src="about:blank"></iframe>
  </div>

  <div id="panel-gui" class="view-panel">
    <div class="touch-wrapper">
      <h3>📱 Pantalla Táctil de la Snapmaker U1 (Interactiva)</h3>
      <iframe id="iframe-gui" src="about:blank"></iframe>
    </div>
  </div>

  <div id="panel-snap" class="view-panel">
  </div>

  <script>
    if (isDeviceTab) {
      document.getElementById('top-control-bar').style.display = 'flex';
      document.getElementById('iframe-fluidd').src = "http://192.168.1.30/";

      const s = document.createElement('script');
      s.src = "flutter_bootstrap.js";
      s.async = true;
      document.getElementById('panel-snap').appendChild(s);
    }

    function showView(viewId) {
      document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

      if (viewId === 'fluidd') {
        document.getElementById('tab-btn-fluidd').classList.add('active');
        const p = document.getElementById('panel-fluidd');
        p.classList.add('active');
        const ifr = document.getElementById('iframe-fluidd');
        if (ifr.src === 'about:blank' || !ifr.src.includes('192.168.1.30')) {
          ifr.src = "http://192.168.1.30/";
        }
      } else if (viewId === 'gui') {
        document.getElementById('tab-btn-gui').classList.add('active');
        const p = document.getElementById('panel-gui');
        p.classList.add('active');
        const ifr = document.getElementById('iframe-gui');
        if (ifr.src === 'about:blank' || !ifr.src.includes('/screen/')) {
          ifr.src = "http://192.168.1.30/screen/";
        }
      } else if (viewId === 'snap') {
        document.getElementById('tab-btn-snap').classList.add('active');
        document.getElementById('panel-snap').classList.add('active');
      }
    }
  </script>

  <script>
    if ('application/octet-stream' in MimeType) {
      MimeType['image/webp'] = 'webp';
    }
    function open_orca_webview() {
      const message = JSON.stringify({
        seqid: 1222222,
        cmd: "sw_OpenOrcaWebview",
        params: {
          url: "http://127.0.0.1:7357/?locale=zh-cn-CN&dark_model=1&path=/",
        },
      });
      window.wx && window.wx.postMessage(message);
    }
    window.sendMessage = function (message) {
      window.wx && window.wx.postMessage(message);
    }
  </script>
</body>
</html>
